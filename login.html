<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — PT. AMF NUSANTARA GROUP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-box">
            <div class="logo-section">
                <h1>PT. AMF NUSANTARA GROUP</h1>
                <p>Sistem Manajemen Laporan & Keuangan</p>
            </div>
            <form id="loginForm">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" required placeholder="Masukkan username">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Masukkan password">
                </div>
                <div class="alert-box" id="alertBox"></div>
                <button type="submit" class="btn-login">Masuk ke Sistem</button>
            </form>
            <p class="hint">Demo: admin / admin123</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
